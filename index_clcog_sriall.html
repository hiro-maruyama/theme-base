function getMapBBox() {
  const b = map.getBounds();
  return [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()];
}

function intersects(b1, b2) {
  return !(
    b2[0] > b1[2] || // west > east
    b2[2] < b1[0] || // east < west
    b2[1] > b1[3] || // south > north
    b2[3] < b1[1]
  );
}

function expandBBox(bbox, margin = 0.1) {
  return [
    bbox[0] - margin,
    bbox[1] - margin,
    bbox[2] + margin,
    bbox[3] + margin
  ];
}

function forceRasterRefresh(layerId) {
  const op = map.getPaintProperty(layerId, 'raster-opacity');
  map.setPaintProperty(layerId, 'raster-opacity', op + 0.00001);
  map.setPaintProperty(layerId, 'raster-opacity', op);
}

function updateCogVisibility() {
  const zoom = map.getZoom();
  const mapBBox = expandBBox(getMapBBox(), 0.15);
  const center = map.getCenter();

  cogLayers.forEach(layer => {
    let visible = false;
    const containsCenter = 
      center.lng >= layer.bbox[0] &&
      center.lng <= layer.bbox[2] &&
      center.lat >= layer.bbox[1] &&
      center.lat <= layer.bbox[3];        

    if (zoom <10) {
        visible =intersects(mapBBox,layer.bbox);
    } else {
      if (containsCenter) {
            visible = true;
      }
    }

    map.setLayoutProperty(
      layer.id,
      'visibility',
      visible ? 'visible' : 'none'
    );

    if (visible) {
      forceRasterRefresh(layer.id);
    }
  });

}

    urlInput.addEventListener('change', () => {
        const inputUrl=urlInput.value.trim();
        if (!inputUrl.toLowerCase().endsWith('.tif') && !inputUrl.toLowerCase().endsWith('.tiff')) {
            alert('拡張子が .tif のURLを入力してください');
            return; // それ以降の処理を中断
        }

        console.log(urlInput.value);
        const addedImage='https://tiles.rdnt.io/tiles/{z}/{x}/{y}?url='+urlInput.value;
        console.log(addedImage);

        const addLayerFunc = () => {
            if (map.getSource('newimage')) {
                if (map.getLayer('newimage-layer')) {
                    map.removeLayer('newimage-layer');
                }
                map.removeSource('newimage');
            }

            map.addSource('newimage', {
                type: 'raster',
                tiles: [addedImage],
                tileSize: 256,
                minzoom: 0
            });

            map.addLayer({
                id: 'newimage-layer',
                source: 'newimage',
                type: 'raster',
                paint: {
                    'raster-opacity': 1.0,
                },
            });

            map.flyTo({
                center:[0,0],
                zoom: 1,
            });
        };

        if (map.loaded()) {
            addLayerFunc();
        } else {
            map.once('load', addLayerFunc);
        }
    });
